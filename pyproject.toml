[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inkling-mlx"
version = "0.1.0"
description = "High-throughput MLX and Metal 4 inference engine for Inkling 2 Mini on Apple Silicon"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "huggingface_hub>=0.25",
  "mlx>=0.30",
  "mlx-vlm>=0.3.9",
  "numpy>=1.26",
  "transformers>=4.49",
]

[project.scripts]
inkling-mlx = "inkling_mlx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inkling_mlx = ["native/*.h", "native/*.mm", "native/*.dylib"]
